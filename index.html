<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I Tell IT All</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center py-10 px-4">

  <main class="w-full max-w-xl space-y-8">
    
    <!-- Header -->
    <header class="text-center space-y-2">
      <h1 class="text-3xl font-extrabold text-white">I Tell IT all</h1>
      <p class="text-slate-400 text-sm">Suarakan isi hatimu tanpa diketahui oleh siapapun!</p>
    </header>

    <!-- Form Input -->
    <section class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 space-y-6">
      <form id="guestbook-form" class="space-y-4">
        
        <div>
          <label for="username" class="block text-sm font-medium text-slate-300 mb-1">Nama / Panggilan</label>
          <input 
            type="text" 
            id="username" 
            maxlength="30" 
            required
            placeholder="Maksimal 30 karakter"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm"
          >
          <div class="text-right text-xs text-slate-500 mt-1"><span id="name-count">0</span>/30</div>
        </div>

        <!-- INPUT TAG KETIKAN BEBAS (KHUSUS USER LOGIN) -->
        <div id="tag-container" class="hidden">
          <label for="message-tag" class="block text-sm font-medium text-slate-300 mb-1">Tag / Kata Kunci (Pisahkan dengan koma)</label>
          <input 
            type="text"
            id="message-tag"
            placeholder="Contoh: curhat, opini, lampung"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
          >
        </div>

        <div>
          <label for="message" class="block text-sm font-medium text-slate-300 mb-1">Pesan</label>
          <textarea 
            id="message" 
            rows="3" 
            maxlength="200" 
            required
            placeholder="Tulis pesan Anda di sini (maksimal 200 karakter)..."
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm resize-none"
          ></textarea>
          <div class="text-right text-xs text-slate-500 mt-1"><span id="msg-count">0</span>/200</div>
        </div>

        <button 
          type="submit" 
          id="submit-btn"
          class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 px-4 rounded-lg transition duration-200 shadow-md hover:shadow-indigo-500/20 active:scale-[0.98] disabled:opacity-50 cursor-pointer"
        >
          Kirim Pesan
        </button>

        <p id="form-status" class="text-center text-xs hidden font-medium"></p>
      </form>

      <!-- SEKSI LOGIN & MEMBERSHIP -->
      <div class="border-t border-slate-700/80 pt-5 mt-4">
        <!-- Tampilan Saat Belum Login -->
        <div id="auth-logged-out" class="space-y-3">
          <p class="text-xs text-slate-400 text-center">Login dengan Google untuk dapat memberikan Tag/Kata Kunci & Opsi Pro!</p>
          <button 
            id="google-login-btn"
            class="w-full flex items-center justify-center gap-3 bg-slate-900 hover:bg-slate-950 border border-slate-700 text-slate-200 font-medium py-2 px-4 rounded-lg transition duration-200 text-sm shadow-sm cursor-pointer"
          >
            <svg class="w-4 h-4" viewBox="0 0 24 24">
              <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.2 9 5 12 5z"/>
              <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
              <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12s.7 2.3 1.9 4.7l3.7-2.9z"/>
              <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.2-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/>
            </svg>
            Masuk dengan Google
          </button>
        </div>

        <!-- Tampilan Saat Sudah Login -->
        <div id="auth-logged-in" class="hidden space-y-3">
          <div class="flex items-center justify-between bg-slate-900/60 p-3 rounded-xl border border-slate-700/50">
            <div class="flex items-center space-x-3">
              <img id="user-avatar" src="" alt="Avatar" class="w-9 h-9 rounded-full border border-slate-600">
              <div>
                <div class="flex items-center gap-1.5">
                  <span id="user-name" class="text-sm font-semibold text-slate-200"></span>
                  <span id="badge-status" class="text-[10px] px-2 py-0.5 rounded-full font-bold"></span>
                </div>
                <p id="user-email" class="text-xs text-slate-400"></p>
              </div>
            </div>
            <button id="logout-btn" class="text-xs text-rose-400 hover:text-rose-300 font-medium px-2 py-1 bg-rose-500/10 hover:bg-rose-500/20 rounded transition cursor-pointer">
              Keluar
            </button>
          </div>

          <!-- Banner Status Membership Pro -->
          <div id="pro-banner" class="bg-gradient-to-r from-amber-500/10 to-yellow-500/10 border border-amber-500/30 p-3 rounded-xl flex items-center justify-between">
            <div>
              <p id="pro-status-text" class="text-xs font-medium text-amber-300"></p>
              <p id="pro-expiry-text" class="text-[11px] text-amber-200/70"></p>
            </div>
            <button id="upgrade-btn" class="text-xs bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3 py-1.5 rounded-lg transition shadow-md shadow-amber-500/20 cursor-pointer">
              Upgrade Pro
            </button>
          </div>
        </div>
      </div>

    </section>

    <!-- Daftar Pesan & Fitur Pencarian -->
    <section class="space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-800 pb-3">
        <h2 class="text-xl font-bold text-slate-200">Pesan Pengunjung</h2>
        
        <!-- BAR PENCARIAN PESAN -->
        <div class="relative w-full sm:w-64">
          <input 
            type="text" 
            id="search-input" 
            placeholder="Cari nama, pesan, atau tag..."
            class="w-full bg-slate-800 border border-slate-700 rounded-lg pl-9 pr-3 py-1.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
          <svg class="w-4 h-4 text-slate-500 absolute left-2.5 top-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
      </div>
      
      <div id="loading" class="text-center py-6 text-slate-500 text-sm">Memuat pesan...</div>
      
      <!-- Kontainer Pesan -->
      <div id="messages-container" class="space-y-3"></div>
    </section>

  </main>

  <script>
    // ==========================================
    // 1. KONFIGURASI SUPABASE
    // ==========================================
    const SUPABASE_URL = 'https://mqjwwtcryupvzqkfcyyz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xand3dGNyeXVwdnpxa2ZjeXl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNDYxMDUsImV4cCI6MjEwNTkyMjEwNX0.67v9HH7p52Z66kB6maV29u3XdGG1-uW5P1RMjzHM85A';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Global State
    let currentUser = null;
    let userProfile = null;
    let allMessages = [];

    // DOM Elements
    const form = document.getElementById('guestbook-form');
    const nameInput = document.getElementById('username');
    const msgInput = document.getElementById('message');
    const tagInput = document.getElementById('message-tag');
    const tagContainer = document.getElementById('tag-container');
    const searchInput = document.getElementById('search-input');
    const nameCount = document.getElementById('name-count');
    const msgCount = document.getElementById('msg-count');
    const submitBtn = document.getElementById('submit-btn');
    const formStatus = document.getElementById('form-status');
    const container = document.getElementById('messages-container');
    const loading = document.getElementById('loading');

    // Auth DOM Elements
    const authLoggedOut = document.getElementById('auth-logged-out');
    const authLoggedIn = document.getElementById('auth-logged-in');
    const googleLoginBtn = document.getElementById('google-login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const userAvatar = document.getElementById('user-avatar');
    const userName = document.getElementById('user-name');
    const userEmail = document.getElementById('user-email');
    const badgeStatus = document.getElementById('badge-status');
    const proStatusText = document.getElementById('pro-status-text');
    const proExpiryText = document.getElementById('pro-expiry-text');
    const upgradeBtn = document.getElementById('upgrade-btn');

    // Counter Karakter
    nameInput.addEventListener('input', () => { nameCount.textContent = nameInput.value.length; });
    msgInput.addEventListener('input', () => { msgCount.textContent = msgInput.value.length; });

    // Event Listener untuk Search
    searchInput.addEventListener('input', () => {
      renderMessages(searchInput.value.trim().toLowerCase());
    });

    // ==========================================
    // 2. FUNGSI RENDER KARTU PESAN
    // ==========================================
    function createMessageCard(name, message, createdAt, isPro = false, messageId = null, tagString = null) {
      const card = document.createElement('div');
      
      if (isPro) {
        card.className = 'bg-gradient-to-r from-amber-950/40 via-slate-800 to-yellow-950/30 p-4 rounded-xl border border-amber-500/40 shadow-lg shadow-amber-500/5 space-y-2 relative overflow-hidden';
      } else {
        card.className = 'bg-slate-800 p-4 rounded-xl border border-slate-700/60 shadow-sm space-y-2';
      }

      const headerDiv = document.createElement('div');
      headerDiv.className = 'flex justify-between items-center border-b border-slate-700/40 pb-2';

      const authorDiv = document.createElement('div');
      authorDiv.className = 'flex items-center gap-1.5 flex-wrap';

      const authorSpan = document.createElement('span');
      authorSpan.className = isPro ? 'font-bold text-amber-400 text-sm' : 'font-semibold text-indigo-300 text-sm';
      authorSpan.textContent = name;
      authorDiv.appendChild(authorSpan);

      if (isPro) {
        const proBadge = document.createElement('span');
        proBadge.className = 'text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/40 px-1.5 py-0.2 rounded font-bold';
        proBadge.textContent = 'PRO';
        authorDiv.appendChild(proBadge);
      }

      if (tagString) {
        const tags = tagString.split(',').map(t => t.trim()).filter(t => t.length > 0);
        tags.forEach(tag => {
          const tagBadge = document.createElement('span');
          tagBadge.className = 'text-[10px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-1.5 py-0.5 rounded-md font-medium';
          tagBadge.textContent = `#${tag}`;
          authorDiv.appendChild(tagBadge);
        });
      }

      const rightHeaderDiv = document.createElement('div');
      rightHeaderDiv.className = 'flex items-center gap-2';

      const dateSpan = document.createElement('span');
      dateSpan.className = 'text-xs text-slate-500';
      const formattedDate = new Date(createdAt).toLocaleDateString('id-ID', {
        day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
      });
      dateSpan.textContent = formattedDate;
      rightHeaderDiv.appendChild(dateSpan);

      // Check Admin
      const userEmailAddress = currentUser ? currentUser.email : null;
      const isSuperAdminEmail = userEmailAddress === 'indonesiantransformit@gmail.com';
      const isAdminFromProfile = userProfile && (userProfile.is_admin === true || userProfile.is_admin === 'true' || userProfile.is_admin === 1);
      const isAdmin = isSuperAdminEmail || isAdminFromProfile;

      if (isAdmin) {
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'text-xs bg-rose-500/20 hover:bg-rose-500/40 text-rose-300 border border-rose-500/30 px-2 py-0.5 rounded transition cursor-pointer ml-2';
        deleteBtn.textContent = 'Hapus';
        deleteBtn.onclick = () => deleteMessage(messageId);
        rightHeaderDiv.appendChild(deleteBtn);
      }

      headerDiv.appendChild(authorDiv);
      headerDiv.appendChild(rightHeaderDiv);

      const bodyP = document.createElement('p');
      bodyP.className = isPro ? 'text-amber-100/90 text-sm whitespace-pre-wrap break-words' : 'text-slate-300 text-sm whitespace-pre-wrap break-words';
      bodyP.textContent = message;

      card.appendChild(headerDiv);
      card.appendChild(bodyP);

      return card;
    }

    function renderMessages(searchKeyword = '') {
      container.innerHTML = '';

      const filtered = allMessages.filter(item => {
        if (!searchKeyword) return true;
        const matchName = item.name ? item.name.toLowerCase().includes(searchKeyword) : false;
        const matchMessage = item.message ? item.message.toLowerCase().includes(searchKeyword) : false;
        const matchTag = item.tag ? item.tag.toLowerCase().includes(searchKeyword) : false;
        return matchName || matchMessage || matchTag;
      });

      if (filtered.length === 0) {
        container.textContent = searchKeyword ? 'Tidak ada pesan yang cocok dengan pencarian.' : 'Belum ada pesan. Jadilah yang pertama!';
        container.className = 'text-center py-6 text-slate-500 text-sm';
        return;
      }

      container.className = 'space-y-3';
      filtered.forEach(item => {
        const card = createMessageCard(item.name, item.message, item.created_at, item.is_pro, item.id, item.tag);
        container.appendChild(card);
      });
    }

    async function deleteMessage(messageId) {
      if (!confirm("Apakah Anda yakin ingin menghapus pesan ini secara permanen?")) return;

      try {
        const { error } = await supabaseClient
          .from('guestbook')
          .delete()
          .eq('id', messageId);

        if (error) throw error;

        alert("Pesan berhasil dihapus!");
        await loadMessages();
      } catch (err) {
        alert("Gagal menghapus pesan: " + err.message);
        console.error('Delete Error:', err);
      }
    }

    // ==========================================
    // 3. SUPABASE AUTH & PROFILE
    // ==========================================
    async function initAuth() {
      // Jalankan loadMessages secara independen dengan Catch
      loadMessages().catch(err => console.error("Message load error:", err));

      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        await handleAuthChange(session?.user || null);
      } catch (e) {
        console.error("Session check error:", e);
      }

      supabaseClient.auth.onAuthStateChange(async (_event, session) => {
        await handleAuthChange(session?.user || null);
      });
    }

    async function handleAuthChange(user) {
      currentUser = user;
      if (user) {
        authLoggedOut.classList.add('hidden');
        authLoggedIn.classList.remove('hidden');
        tagContainer.classList.remove('hidden');

        userName.textContent = user.user_metadata?.full_name || user.email.split('@')[0];
        userEmail.textContent = user.email;
        userAvatar.src = user.user_metadata?.avatar_url || 'https://via.placeholder.com/150';

        if (!nameInput.value) {
          nameInput.value = user.user_metadata?.full_name || '';
          nameCount.textContent = nameInput.value.length;
        }

        await fetchUserProfile(user.id);
      } else {
        userProfile = null;
        authLoggedOut.classList.remove('hidden');
        authLoggedIn.classList.add('hidden');
        tagContainer.classList.add('hidden');
      }
    }

    async function fetchUserProfile(userId) {
      try {
        const { data, error } = await supabaseClient
          .from('profiles')
          .select('*')
          .eq('id', userId)
          .maybeSingle();

        if (error) throw error;

        userProfile = data;
        updateProUI();
        renderMessages(searchInput.value.trim().toLowerCase());
      } catch (err) {
        console.error('Error fetching profile:', err);
      }
    }

    function isProActive() {
      if (!userProfile) return false;
      if (!userProfile.is_pro) return false;
      if (!userProfile.pro_until) return true;
      return new Date(userProfile.pro_until) > new Date();
    }

    function updateProUI() {
      const active = isProActive();

      if (active) {
        badgeStatus.textContent = 'PRO';
        badgeStatus.className = 'text-[10px] px-2 py-0.5 rounded-full font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30';
        
        proStatusText.textContent = 'Status Membership: PRO Active 🌟';
        if (userProfile.pro_until) {
          const exp = new Date(userProfile.pro_until).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
          proExpiryText.textContent = `Aktif hingga: ${exp}`;
        } else {
          proExpiryText.textContent = 'Status: Member Pro Selamanya';
        }
        upgradeBtn.textContent = 'Perpanjang';
      } else {
        badgeStatus.textContent = 'FREE';
        badgeStatus.className = 'text-[10px] px-2 py-0.5 rounded-full font-bold bg-slate-700 text-slate-400';
        
        proStatusText.textContent = 'Status Membership: Pengguna Gratis';
        proExpiryText.textContent = 'Upgrade ke Pro agar warna pesan Anda tampil beda!';
        upgradeBtn.textContent = 'Upgrade Pro';
      }
    }

    // Auth Action Handlers
    googleLoginBtn.addEventListener('click', async () => {
      try {
        googleLoginBtn.disabled = true;
        googleLoginBtn.textContent = 'Mengarahkan ke Google...';

        const { error } = await supabaseClient.auth.signInWithOAuth({
          provider: 'google',
          options: { 
            redirectTo: window.location.origin + window.location.pathname,
            queryParams: { prompt: 'select_account' }
          }
        });

        if (error) throw error;
      } catch (err) {
        alert("Gagal menghubungkan ke Google Login: " + err.message);
        console.error('Login Error:', err);
        googleLoginBtn.disabled = false;
        googleLoginBtn.innerHTML = `
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.2 9 5 12 5z"/>
            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
            <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12s.7 2.3 1.9 4.7l3.7-2.9z"/>
            <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.2-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/>
          </svg>
          Masuk dengan Google
        `;
      }
    });

    logoutBtn.addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      googleLoginBtn.disabled = false;
    });

    upgradeBtn.addEventListener('click', async () => {
      if (!currentUser) return;
      
      const confirmUpgrade = confirm("Simulasi Upgrade Membership Pro (30 Hari):\n\nTekan OK untuk aktifkan status PRO pada akun Anda.");
      if (confirmUpgrade) {
        const nextMonth = new Date();
        nextMonth.setDate(nextMonth.getDate() + 30);

        const { error } = await supabaseClient
          .from('profiles')
          .upsert({
            id: currentUser.id,
            email: currentUser.email,
            is_pro: true,
            pro_until: nextMonth.toISOString()
          });

        if (!error) {
          alert("Selamat! Membership PRO Anda berhasil diaktifkan selama 30 hari.");
          await fetchUserProfile(currentUser.id);
        } else {
          alert("Gagal memperbarui status membership: " + error.message);
          console.error(error);
        }
      }
    });

    // ==========================================
    // 4. FETCH DATA DARI SUPABASE
    // ==========================================
    async function loadMessages() {
      try {
        const { data, error } = await supabaseClient
          .from('guestbook')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        loading.classList.add('hidden');
        allMessages = data || [];
        renderMessages(searchInput.value.trim().toLowerCase());

      } catch (err) {
        loading.textContent = 'Gagal memuat pesan: ' + err.message;
        console.error('Fetch Error:', err);
      }
    }

    // ==========================================
    // 5. SUBMIT FORM
    // ==========================================
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const sanitizedName = nameInput.value.trim();
      const sanitizedMsg = msgInput.value.trim();
      const rawTags = currentUser ? tagInput.value.trim() : null;

      if (!sanitizedName || !sanitizedMsg) {
        showStatus('Nama dan pesan tidak boleh kosong!', 'text-red-400');
        return;
      }

      if (sanitizedName.length > 30 || sanitizedMsg.length > 200) {
        showStatus('Input melebihi batas karakter!', 'text-red-400');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Mengirim...';

      const userIsPro = isProActive();

      try {
        const { error } = await supabaseClient
          .from('guestbook')
          .insert([
            { 
              name: sanitizedName, 
              message: sanitizedMsg,
              is_pro: userIsPro,
              tag: rawTags || null
            }
          ]);

        if (error) throw error;

        showStatus('Pesan berhasil dikirim!', 'text-emerald-400');
        
        // Reset hanya field pesan
        msgInput.value = '';
        msgCount.textContent = '0';
        if (tagInput) tagInput.value = '';

        await loadMessages();

      } catch (err) {
        showStatus('Gagal mengirim pesan: ' + err.message, 'text-red-400');
        console.error('Insert Error:', err);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Kirim Pesan';
      }
    });

    function showStatus(msg, colorClass) {
      formStatus.textContent = msg;
      formStatus.className = `text-center text-xs mt-2 ${colorClass}`;
      formStatus.classList.remove('hidden');
      setTimeout(() => {
        formStatus.classList.add('hidden');
      }, 4000);
    }

    // Single Entry Point Initialization
    initAuth();
  </script>
</body>
</html>
